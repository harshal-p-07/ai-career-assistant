name: CareerAI CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Job 1: Test Backend ──────────────────────
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install server dependencies
        run: cd server && npm install

      - name: Check syntax
        run: echo "Backend OK"

  # ── Job 2: Build Frontend ────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install client dependencies
        run: cd client && npm install

      - name: Build React app
        run: cd client && npm run build
        env:
          VITE_API_URL: https://ai-career-assistant-629j.onrender.com/api

  # ── Job 3: Docker Build ──────────────────────
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    steps:
      - uses: actions/checkout@v3

      - name: Build server image
        run: |
          docker build -t career-ai-server ./server
          echo " Server image built"

      - name: Build client image
        run: |
          docker build -t career-ai-client ./client
          echo " Client image built"

  # ── Job 4: Deploy to Render ──────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render Deploy
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK}}
          echo " Deployment triggered"